name: Release

# Build cross-platform binaries and attach them to a GitHub release
# whenever a version tag (e.g. v0.1.0) is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/dir-analyzer"
          tar -czf "dir-analyzer-${{ matrix.target }}.tar.gz" -C "$(dirname "$bin")" dir-analyzer
          shasum -a 256 "dir-analyzer-${{ matrix.target }}.tar.gz" > "dir-analyzer-${{ matrix.target }}.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/dir-analyzer.exe"
          $archive = "dir-analyzer-${{ matrix.target }}.zip"
          Compress-Archive -Path $bin -DestinationPath $archive
          (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() | Out-File "$archive.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dir-analyzer-${{ matrix.target }}.tar.gz
            dir-analyzer-${{ matrix.target }}.tar.gz.sha256
            dir-analyzer-${{ matrix.target }}.zip
            dir-analyzer-${{ matrix.target }}.zip.sha256
          fail_on_unmatched_files: false
